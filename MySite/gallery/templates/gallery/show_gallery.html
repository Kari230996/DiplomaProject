{% extends 'base.html' %}

{% load static %}
{% load i18n %}

{% block title %}
{{ title }} :: {{ block.super }}
{% endblock %}

{% block extra_head %}

<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

<link href="https://unpkg.com/aos@2.3.1/dist/aos.css"
  rel="stylesheet">

<style>
  body {
    background:
      linear-gradient(to bottom, #f7f6f4, #efeeeb);
  }

  .gallery-container {
    column-count: 3;
    column-gap: 18px;
  }

  .gallery-item {
    margin-bottom: 18px;
    break-inside: avoid;
    overflow: hidden;
    border-radius: 22px;
  }

  .gallery-img {
    width: 100%;
    display: block;
    border-radius: 22px;
    cursor: pointer;
    transition: 0.45s ease;

    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.10);
  }

  .gallery-img:hover {
    transform:
      translateY(-4px) scale(1.015);

    box-shadow:
      0 20px 45px rgba(0, 0, 0, 0.16);
  }

  @media(max-width: 1100px) {
    .gallery-container {
      column-count: 2;
    }
  }

  @media(max-width: 700px) {
    .gallery-container {
      column-count: 1;
    }
  }

  /* =========================
      MODAL
  ========================== */

  #modal {
    display: none;

    position: fixed;
    z-index: 9999;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    overflow-y: auto;

    background:
      rgba(0, 0, 0, 0.84);

    backdrop-filter: blur(8px);
  }

  .modal-container {
    width: 94%;
    max-width: 1500px;

    margin: 45px auto;

    display: flex;
    gap: 40px;

    align-items: center;
    justify-content: center;
  }

  .modal-left {
    flex: 1;

    display: flex;
    justify-content: center;
  }

  .modal-left img {
    width: 100%;
    max-height: 90vh;

    object-fit: contain;

    border-radius: 20px;

    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.45);

    transition: 0.4s ease;
  }

  .modal-left img:hover {
    transform: scale(1.01);
  }

  .modal-right {
    width: 430px;
    min-width: 430px;

    background:
      rgba(255, 255, 255, 0.97);

    border-radius: 28px;

    padding: 42px;

    box-shadow:
      0 15px 45px rgba(0, 0, 0, 0.22);

    display: flex;
    flex-direction: column;

    max-height: 88vh;

    overflow-y: auto;
  }

  #modal-title {
    font-size: 48px;
    font-weight: 300;

    line-height: 1.05;

    margin-bottom: 24px;

    color: #1f1f1f;
  }

  .painting-meta {
    display: flex;
    flex-wrap: wrap;

    gap: 12px;

    margin-bottom: 28px;
  }

  .painting-meta span {
    background:
      rgba(0, 0, 0, 0.05);

    padding: 10px 16px;

    border-radius: 999px;

    font-size: 13px;

    color: #444;

    letter-spacing: 0.4px;
  }

  #modal-desc {
    font-size: 16px;

    line-height: 1.9;

    color: #555;

    margin-bottom: 36px;
  }

  .input-button {
    width: 100%;

    background: #1e1e1e;

    border: none;

    color: white;

    padding: 17px;

    border-radius: 16px;

    font-size: 14px;

    letter-spacing: 1px;

    cursor: pointer;

    transition: 0.35s ease;
  }

  .input-button:hover {
    background: #333;

    transform: translateY(-2px);
  }

  .close-button {
    position: fixed;

    right: 28px;
    top: 28px;

    width: 52px;
    height: 52px;

    border-radius: 50%;

    border: none;

    background:
      rgba(255, 255, 255, 0.12);

    color: white;

    font-size: 24px;

    cursor: pointer;

    transition: 0.35s ease;
  }

  .close-button:hover {
    background:
      rgba(255, 255, 255, 0.2);

    transform: rotate(90deg);
  }

  @media(max-width: 950px) {

    .modal-container {
      flex-direction: column;
      margin-top: 85px;
    }

    .modal-right {
      width: 100%;
      min-width: unset;
    }

    #modal-title {
      font-size: 36px;
    }
  }
</style>

{% endblock %}



{% block content %}

<div class="container mt-5 animated-element">

  <div class="gallery-container">

    {% for item in gallery %}

    <div data-aos="fade-up"
      class="gallery-item">

      <img src="{{ item.photo.url }}"

        alt="{% if request.LANGUAGE_CODE == 'ru' and item.title_ru %}{{ item.title_ru }}{% else %}{{ item.title }}{% endif %}"

        class="gallery-img"

        data-img="{{ item.photo.url }}"

        data-title="{% if request.LANGUAGE_CODE == 'ru' and item.title_ru %}{{ item.title_ru|escapejs }}{% else %}{{ item.title|escapejs }}{% endif %}"

        data-content="{% if request.LANGUAGE_CODE == 'ru' and item.content_ru %}{{ item.content_ru|safe|escapejs }}{% else %}{{ item.content|safe|escapejs }}{% endif %}"

        data-pk="{{ item.pk }}"

        data-materials="{{ item.materials }}"

        data-width="{{ item.width }}"

        data-height="{{ item.height }}"

        data-year="{{ item.year_created }}"

        data-status="{{ item.get_status_display }}">

    </div>

    {% endfor %}

  </div>

</div>



<!-- MODAL -->

<div id="modal"
  class="modal">

  <div class="modal-container">

    <!-- LEFT -->

    <div class="modal-left">

      <img id="modal-img"
        src=""
        alt="">

    </div>

    <!-- RIGHT -->

    <div class="modal-right">

      <h1 id="modal-title"></h1>

      <div class="painting-meta">

        <span id="modal-materials"></span>

        <span id="modal-size"></span>

        <span id="modal-year"></span>

        <span id="modal-status"></span>

      </div>

      <div id="modal-desc"></div>

      <button id="modal-button"
        class="input-button">

        {% trans "Learn More" %}

      </button>

    </div>

  </div>

  <button class="icon-button close-button"
    id="close-modal">

    ×

  </button>

</div>

{% endblock %}



{% block extra_js %}

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>

  $(document).ready(function () {

    AOS.init({
      duration: 1600,
    });

    function unescape(escapedStr) {

      return escapedStr.replace(
        /\\u([a-fA-F0-9]{4})/g,
        function (_, hex) {
          return String.fromCharCode(parseInt(hex, 16));
        }
      );
    }

    $('.gallery-img').hover(

      function () {
        $(this).addClass(
          'animate__animated animate__pulse'
        );
      },

      function () {
        $(this).removeClass(
          'animate__animated animate__pulse'
        );
      }
    );

    $('.gallery-img').click(function () {

      var img =
        $(this).attr('data-img');

      var title =
        $(this).attr('data-title');

      var escapedContent =
        $(this).attr('data-content');

      var content =
        unescape(escapedContent);

      content =
        content.substring(0, 650) + '...';

      var pk =
        $(this).attr('data-pk');

      var materials =
        $(this).attr('data-materials');

      var width =
        $(this).attr('data-width');

      var height =
        $(this).attr('data-height');

      var year =
        $(this).attr('data-year');

      var status =
        $(this).attr('data-status');

      $('#modal-img').attr('src', img);

      $('#modal-title').html(title);

      $('#modal-desc').html(content);

      $('#modal-button').attr('data-pk', pk);

      $('#modal-materials').text(materials);

      $('#modal-year').text(year);

      $('#modal-status').text(status);

      {% if request.LANGUAGE_CODE == 'ru' %}

      $('#modal-size').text(
        width + ' × ' + height + ' см'
      );

      {% else %}

      $('#modal-size').text(
        width + ' × ' + height + ' cm'
      );

      {% endif %}

      $('#modal')
        .show()
        .addClass(
          'animate__animated animate__zoomIn'
        );
    });

    $('#modal-button').click(function () {

      var pk =
        $(this).attr('data-pk');

      var url =
        '/gallery/painting/' + pk + '/';

      window.location.href = url;
    });

    $('#close-modal').click(function () {

      $('#modal').addClass(
        'animate__animated animate__zoomOut'
      );

      setTimeout(function () {

        $('#modal')
          .hide()
          .removeClass(
            'animate__animated animate__zoomIn animate__zoomOut'
          );

      }, 500);
    });

  });

</script>

{% endblock %}
