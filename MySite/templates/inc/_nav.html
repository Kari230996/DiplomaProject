{% load static %}
{% load i18n %}

<div class="home-container1">

  <header data-role="Header" class="home-header">

    <!-- Logo -->
    <a href="{% url 'home' %}">
      <img alt="logo" src="{% static 'images/logo.svg' %}" class="home-image" />
    </a>

    <!-- Desktop Navigation -->
    <div class="home-nav">

      <nav class="navigation-links2-nav">

        <a class="navigation-links2-text" href="{% url 'home' %}">
          {% trans "Home" %}
        </a>

        <a class="navigation-links2-text1" href="{% url 'show_gallery' %}">
          {% trans "Gallery" %}
        </a>

        <a class="navigation-links2-text2" href="{% url 'about-us' %}">
          {% trans "About" %}
        </a>

        <a class="navigation-links2-text3" href="{% url 'contacts' %}">
          {% trans "Contact" %}
        </a>

      </nav>

    </div>

    <!-- Right Side -->
    <div class="header-right">

      <!-- Language Switcher -->
      <div class="home-btn-group language-switcher">

        <svg viewBox="0 0 1024 1024" class="home-icon" onclick="toggleLanguageMenu()">

          <path
            d="M698 598h144q12-56 12-86t-12-86h-144q6 42 6 86t-6 86zM622 834q50-16 104-61t82-91h-126q-20 80-60 152zM612 598q6-42 6-86t-6-86h-200q-6 42-6 86t6 86h200zM512 852q56-82 82-170h-164q26 88 82 170zM342 342q24-86 60-152-50 16-105 61t-81 91h126zM216 682q26 46 81 91t105 61q-40-72-60-152h-126zM182 598h144q-6-42-6-86t6-86h-144q-12 56-12 86t12 86zM512 172q-56 82-82 170h164q-26-88-82-170zM808 342q-28-46-82-91t-104-61q36 66 60 152h126zM512 86q176 0 301 125t125 301-125 301-301 125-301-125-125-301 125-301 301-125z">
          </path>

        </svg>

        <div id="language-menu" class="language-menu">

          <form action="{% url 'set_language' %}" method="post">

            {% csrf_token %}

            <button type="submit" name="language" value="en">
              English
            </button>

            <button type="submit" name="language" value="ru">
              Русский
            </button>

          </form>

        </div>

      </div>

      <!-- Burger -->
      <div class="home-burger-menu">

        <svg viewBox="0 0 1024 1024" class="home-icon02">

          <path
            d="M128 554.667h768c23.552 0 42.667-19.115 42.667-42.667s-19.115-42.667-42.667-42.667h-768c-23.552 0-42.667 19.115-42.667 42.667s19.115 42.667 42.667 42.667zM128 298.667h768c23.552 0 42.667-19.115 42.667-42.667s-19.115-42.667-42.667-42.667h-768c-23.552 0-42.667 19.115-42.667 42.667s19.115 42.667 42.667 42.667zM128 810.667h768c23.552 0 42.667-19.115 42.667-42.667s-19.115-42.667-42.667-42.667h-768c-23.552 0-42.667 19.115-42.667 42.667s19.115 42.667 42.667 42.667z">
          </path>

        </svg>

      </div>

    </div>

  </header>

</div>

<!-- MOBILE MENU -->

<div class="home-mobile-menu">

  <div class="mobile-menu-top">

    <img alt="logo" src="{% static 'images/logo.svg' %}" class="home-image1" />

    <div class="home-menu-close">
      ✕
    </div>

  </div>

  <nav class="mobile-nav-links">

    <a href="{% url 'home' %}">
      {% trans "Home" %}
    </a>

    <a href="{% url 'show_gallery' %}">
      {% trans "Gallery" %}
    </a>

    <a href="{% url 'about-us' %}">
      {% trans "About" %}
    </a>

    <a href="{% url 'contacts' %}">
      {% trans "Contact" %}
    </a>

  </nav>

  <!-- Mobile language -->
  <div class="mobile-language-switcher">

    <form action="{% url 'set_language' %}" method="post">

      {% csrf_token %}

      <button type="submit" name="language" value="en" class="{% if LANGUAGE_CODE == 'en' %}active-language{% endif %}">
        English
      </button>

      <button type="submit" name="language" value="ru" class="{% if LANGUAGE_CODE == 'ru' %}active-language{% endif %}">
        Русский
      </button>

    </form>

  </div>

</div>

<style>
  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  /* LANGUAGE */

  .language-switcher {
    position: relative;
    cursor: pointer;
  }

  .language-menu {
    display: none;

    position: absolute;

    top: 45px;
    right: 0;

    background: white;

    border-radius: 12px;

    padding: 10px;

    min-width: 140px;

    box-shadow:
      0 5px 20px rgba(0, 0, 0, 0.15);

    z-index: 9999;
  }

  .language-menu button {
    display: block;

    width: 100%;

    border: none;
    background: transparent;

    padding: 10px;

    text-align: left;

    cursor: pointer;

    border-radius: 8px;
  }

  .language-menu button:hover {
    background: #f3f3f3;
  }

  /* BURGER */

  .home-burger-menu {
    display: none;

    cursor: pointer;
  }

  .home-icon02 {
    width: 32px;
    height: 32px;
  }

  /* MOBILE MENU */

  .home-mobile-menu {
    position: fixed;

    top: 0;
    left: -100%;

    width: 100%;
    height: 100vh;

    background: white;

    z-index: 99999;

    transition: 0.4s;

    padding: 30px;

    display: flex;
    flex-direction: column;
  }

  .home-mobile-menu.active {
    left: 0;
  }

  .mobile-menu-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 50px;
  }

  .home-menu-close {
    font-size: 32px;
    cursor: pointer;
  }

  .mobile-nav-links {
    display: flex;
    flex-direction: column;

    gap: 25px;
  }

  .mobile-nav-links a {
    font-size: 28px;

    color: black;

    text-decoration: none;

    font-weight: 300;
  }

  .mobile-language-switcher {

    margin-top: auto;
    padding-top: 30px;
  }

  .mobile-language-switcher form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .mobile-language-switcher button {
    display: block;
    width: 100%;
    margin-bottom: 12px;
    border: 1px solid #e5e5e5;
    background: #ffffff;
    color: #222;
    font-size: 20px;
    font-weight: 500;
    text-align: left;
    padding: 18px 20px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.25s ease;

  }

  .mobile-language-switcher button:hover {
    background: #f7f7f7;
  }

  .active-language {
    background: #222 !important;
    color: white !important;
    border-color: #222 !important;
  }

  /* RESPONSIVE */

  @media(max-width: 767px) {

    .home-nav {
      display: none;
    }

    .home-burger-menu {
      display: flex;
      align-items: center;
      justify-content: center;
    }

  }
</style>

<script>

  // LANGUAGE MENU

  function toggleLanguageMenu() {

    const menu = document.getElementById("language-menu");

    if (menu.style.display === "block") {
      menu.style.display = "none";
    }

    else {
      menu.style.display = "block";
    }
  }

  document.addEventListener('click', function (event) {

    const switcher = document.querySelector('.language-switcher');

    if (switcher && !switcher.contains(event.target)) {

      document.getElementById("language-menu").style.display = "none";
    }

  });

  // MOBILE MENU

  document.addEventListener("DOMContentLoaded", function () {

    const burger =
      document.querySelector(".home-burger-menu");

    const mobileMenu =
      document.querySelector(".home-mobile-menu");

    const closeBtn =
      document.querySelector(".home-menu-close");

    burger.addEventListener("click", function () {

      mobileMenu.classList.add("active");

    });

    closeBtn.addEventListener("click", function () {

      mobileMenu.classList.remove("active");

    });

  });

</script>
