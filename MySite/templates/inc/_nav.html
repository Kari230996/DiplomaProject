{% load static %}
{% load i18n %}

<div class="home-container1">

  <header data-role="Header" class="home-header">

    <a href="{% url 'home' %}">
      <img alt="logo" src="{% static 'images/logo.svg' %}" class="home-image" />
    </a>

    <!-- Desktop Navigation -->
    <div class="home-nav">
      <nav class="navigation-links2-nav navigation-links2-root-class-name20">

        <a class="navigation-links2-text" href="{% url 'home' %}">
          <span>{% trans "Home" %}</span>
        </a>

        <a class="navigation-links2-text1" href="{% url 'show_gallery' %}">
          <span>{% trans "Gallery" %}</span>
        </a>

        <a href="{% url 'about-us' %}">
          <span class="navigation-links2-text2">
            {% trans "About" %}
          </span>
        </a>

        <a class="navigation-links2-text3" href="{% url 'contacts' %}">
          <span>{% trans "Contact" %}</span>
        </a>

      </nav>
    </div>

    <!-- Language Switcher -->
    <div class="home-btn-group language-switcher">

      <svg viewBox="0 0 1024 1024" class="home-icon" onclick="toggleLanguageMenu()">

        <path
          d="M698 598h144q12-56 12-86t-12-86h-144q6 42 6 86t-6 86zM622 834q50-16 104-61t82-91h-126q-20 80-60 152zM612 598q6-42 6-86t-6-86h-200q-6 42-6 86t6 86h200zM512 852q56-82 82-170h-164q26 88 82 170zM342 342q24-86 60-152-50 16-105 61t-81 91h126zM216 682q26 46 81 91t105 61q-40-72-60-152h-126zM182 598h144q-6-42-6-86t6-86h-144q-12 56-12 86t12 86zM512 172q-56 82-82 170h164q-26-88-82-170zM808 342q-28-46-82-91t-104-61q36 66 60 152h126zM512 86q176 0 301 125t125 301-125 301-301 125-301-125-125-301 125-301 301-125z">
        </path>

      </svg>

      <div id="language-menu" class="language-menu">

        <form action="{% url 'set_language' %}" method="post">
          {% csrf_token %}

          <button type="submit" name="language" value="en">
            English
          </button>

          <button type="submit" name="language" value="ru">
            Русский
          </button>

        </form>

      </div>

    </div>

    <!-- Burger -->
    <div data-role="BurgerMenu" class="home-burger-menu">
      <svg viewBox="0 0 1024 1024" class="home-icon02">
        <path
          d="M128 554.667h768c23.552 0 42.667-19.115 42.667-42.667s-19.115-42.667-42.667-42.667h-768c-23.552 0-42.667 19.115-42.667 42.667s19.115 42.667 42.667 42.667z">
        </path>
      </svg>
    </div>

    <!-- Mobile Menu -->
    <div data-role="MobileMenu" class="home-mobile-menu">

      <div class="home-nav1">

        <div class="home-container2">

          <img alt="image" src="{% static 'images/logo.svg' %}" class="home-image1" />

        </div>

        <nav class="navigation-links2-nav navigation-links2-root-class-name21">

          <a class="navigation-links2-text" href="{% url 'home' %}">
            <span>{% trans "Home" %}</span>
          </a>

          <a class="navigation-links2-text1" href="{% url 'show_gallery' %}">
            <span>{% trans "Gallery" %}</span>
          </a>

          <a class="navigation-links2-text2" href="{% url 'about-us' %}">
            <span>{% trans "About" %}</span>
          </a>

          <a class="navigation-links2-text3" href="{% url 'contacts' %}">
            <span>{% trans "Contact" %}</span>
          </a>

        </nav>

      </div>

    </div>

  </header>

</div>

<!-- Language Switcher CSS -->
<style>
  .language-switcher {
    position: relative;
    cursor: pointer;
  }

  .language-menu {
    display: none;
    position: absolute;
    top: 45px;
    right: 0;
    background: white;
    border-radius: 12px;
    padding: 10px;
    min-width: 140px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    z-index: 9999;
  }

  .language-menu button {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    padding: 10px;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
  }

  .language-menu button:hover {
    background: #f3f3f3;
  }
</style>

<!-- Language Switcher JS -->
<script>

  function toggleLanguageMenu() {

    const menu = document.getElementById("language-menu");

    if (menu.style.display === "block") {
      menu.style.display = "none";
    } else {
      menu.style.display = "block";
    }
  }

  document.addEventListener('click', function (event) {

    const switcher = document.querySelector('.language-switcher');

    if (!switcher.contains(event.target)) {
      document.getElementById("language-menu").style.display = "none";
    }
  });

</script>
